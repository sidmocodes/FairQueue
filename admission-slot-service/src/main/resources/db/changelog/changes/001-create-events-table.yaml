databaseChangeLog:
  - changeSet:
      id: 001-create-events-table
      author: fairqueue
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_events
              - column:
                  name: event_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_events_event_id
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_capacity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: admission_rate_per_minute
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: event_start_time
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: queue_open_time
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
        - createIndex:
            indexName: idx_events_event_id
            tableName: events
            columns:
              - column:
                  name: event_id
        - createIndex:
            indexName: idx_events_active
            tableName: events
            columns:
              - column:
                  name: active
      rollback:
        - dropTable:
            tableName: events
