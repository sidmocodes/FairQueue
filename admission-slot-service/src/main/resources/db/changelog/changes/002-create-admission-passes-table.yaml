databaseChangeLog:
  - changeSet:
      id: 002-create-admission-passes-table
      author: fairqueue
      changes:
        - createTable:
            tableName: admission_passes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_admission_passes
              - column:
                  name: pass_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_admission_passes_pass_id
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: used_by
                  type: VARCHAR(255)
              - column:
                  name: used_at
                  type: TIMESTAMP WITHOUT TIME ZONE
        - createIndex:
            indexName: idx_pass_id
            tableName: admission_passes
            unique: true
            columns:
              - column:
                  name: pass_id
        - createIndex:
            indexName: idx_user_event
            tableName: admission_passes
            columns:
              - column:
                  name: user_id
              - column:
                  name: event_id
        - createIndex:
            indexName: idx_expires_at
            tableName: admission_passes
            columns:
              - column:
                  name: expires_at
        - createIndex:
            indexName: idx_admission_passes_used
            tableName: admission_passes
            columns:
              - column:
                  name: used
      rollback:
        - dropTable:
            tableName: admission_passes
