spring.application.name=queue-service
server.port=8081

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Token Configuration
fairqueue.token.secret=${TOKEN_SECRET:defaultSecretKeyThatShouldBeChangedInProduction123456789}
fairqueue.token.validity=3600

# Logging
logging.level.com.fairqueue=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
