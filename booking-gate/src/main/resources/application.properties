spring.application.name=booking-gate
server.port=8083

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fairqueue}
spring.datasource.username=${DATABASE_USERNAME:fairqueue}
spring.datasource.password=${DATABASE_PASSWORD:fairqueue}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Admission Service URL
fairqueue.admission-service.url=${ADMISSION_SERVICE_URL:http://localhost:8082}

# Token Configuration
fairqueue.token.secret=${TOKEN_SECRET:defaultSecretKeyThatShouldBeChangedInProduction123456789}

# Logging
logging.level.com.fairqueue=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
